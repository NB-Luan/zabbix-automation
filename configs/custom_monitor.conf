# ==============================================================================
# custom_monitor.conf - Custom Zabbix Agent 2 UserParameter Definitions
# Target: /etc/zabbix/zabbix_agent2.d/custom_monitor.conf
# Target Host: VM2 web-server (192.168.56.21)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Nginx Deep Metrics (Exact Keys)
# ------------------------------------------------------------------------------
UserParameter=custom.nginx.response_ms,/usr/local/bin/nginx_custom_metrics.sh response_ms
UserParameter=custom.nginx.error_5xx,/usr/local/bin/nginx_custom_metrics.sh error_5xx
UserParameter=custom.nginx.active_conn,/usr/local/bin/nginx_custom_metrics.sh active_conn

# Optional bracketed syntax support: custom.nginx[response_ms]
UserParameter=custom.nginx[*],/usr/local/bin/nginx_custom_metrics.sh "$1"

# ------------------------------------------------------------------------------
# 2. Linux System Health & Stability Metrics (Exact Keys)
# ------------------------------------------------------------------------------
UserParameter=custom.sys.zombie_procs,/usr/local/bin/system_health_check.sh zombie_procs
UserParameter=custom.sys.failed_units,/usr/local/bin/system_health_check.sh failed_units
UserParameter=custom.sys.disk_io_util,/usr/local/bin/system_health_check.sh disk_io_util

# Optional bracketed syntax support: custom.sys[zombie_procs]
UserParameter=custom.sys[*],/usr/local/bin/system_health_check.sh "$1"
